name: Deploy

on:
  push:
    branches: [master]

env:
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      nest-api: ${{ steps.filter.outputs.nest-api }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
            nest-api:
              - 'apps/nest-api/**'
              - 'packages/**'

  deploy-web:
    needs: changes
    if: needs.changes.outputs.web == 'true' # ← 只有相关文件变更才触发
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1
      - name: Build & push web image
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin $ECR_REGISTRY
          docker build -f apps/web/Dockerfile -t $ECR_REGISTRY/sanpo/web:${{ github.sha }} .
          docker push $ECR_REGISTRY/sanpo/web:${{ github.sha }}
      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster sanpo-prod \
            --service sanpo/web \
            --force-new-deployment
  deploy-nest-api:
    needs: changes
    if: needs.changes.outputs.nest-api == 'true' # ← web 和 api 独立部署，互不影响
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1
      - name: Build & push web image
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin $ECR_REGISTRY
          docker build -f apps/web/Dockerfile -t $ECR_REGISTRY/sanpo/nest/api:${{ github.sha }} .
          docker push $ECR_REGISTRY/sanpo/nest/api:${{ github.sha }}
      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster sanpo-prod \
            --service sanpo/nest/api \
            --force-new-deployment
